name: Build and Test

# Deliberately not scoped to a branch list. The publish workflows here are limited to `main`
# because releasing is gated; running the test suite is not, and a regression should surface on
# the feature branch that introduced it rather than waiting for a pull request to be opened.
on:
  push:
  pull_request:

# A same-repo pull request fires both triggers above, and each new push supersedes the run before
# it, so cancel anything still in flight for the same ref.
concurrency:
  group: build-and-test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build and Test
    runs-on: ubuntu-latest

    env:
      # The single most important line in this file. Player.Api.Tests falls back to SQLite when no
      # Docker daemon is reachable so that a contributor without Docker still gets coverage; in CI
      # that fallback would report a green run that never touched production's database. With this
      # set, DatabaseFixture turns an unavailable daemon into a hard failure instead.
      # See Player.Api.Tests/Support/DatabaseFixture.cs.
      PLAYER_TESTS_REQUIRE_POSTGRES: "true"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup dotnet
        uses: actions/setup-dotnet@v5
        with:
          # The SDK version lives in global.json; never pin a second copy of it here.
          global-json-file: global.json

      # Keyed on the files that decide what gets restored: Directory.Packages.props holds every
      # version, and a project file changing is what adds or drops a reference.
      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('Directory.Packages.props', '**/*.csproj') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore

      # Testcontainers starts and disposes the PostgreSQL container itself, so this job
      # intentionally has no `services: postgres:` block.
      #
      # xUnit.DiagnosticMessages surfaces DatabaseFixture's provider banner. Without it the VSTest
      # bridge discards the test host's stdout and the log never records which database the run
      # actually used. `tee` keeps it for the assertion in the next step.
      #
      # It has to be passed here rather than set as `diagnosticMessages` in xunit.runner.json: with
      # the setting in that file, the run hangs after the last test instead of finishing — the host
      # stays alive and never reports completion. Reproduced on SDK 10.0.103 with VSTest 18.0.1 and
      # xunit.v3 3.2.2; the same run with the flag below finishes in about twenty seconds.
      - name: Test
        run: |
          set -o pipefail
          dotnet test --no-build --logger "trx;LogFileName=test-results.trx" \
            -- xUnit.DiagnosticMessages=true | tee "$RUNNER_TEMP/test.log"

      # PLAYER_TESTS_REQUIRE_POSTGRES already fails the run if PostgreSQL is unavailable, so this is
      # a second, independent check on the same guarantee: it reads what the suite reported rather
      # than trusting that the environment variable was honoured.
      - name: Confirm the suite ran against PostgreSQL
        # Block scalar, not a plain one: the pattern contains a colon-space, which YAML would
        # otherwise read as the start of a mapping entry.
        run: |
          grep -F '[Player.Api.Tests] database provider: PostgreSql' "$RUNNER_TEMP/test.log"

      # Unconditional, so that a failing run still publishes which tests failed rather than only the
      # summary line in the log. Coverage is deliberately not collected here: nothing gates on the
      # figure, so it is a local exercise — see docs/Testing.md.
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results
          path: Player.Api.Tests/TestResults/test-results.trx
          if-no-files-found: error
